name: Gateway host contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out gateway
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gateway
          persist-credentials: false
      - name: Read exact PCC source pin
        id: pcc
        working-directory: gateway
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          pin = json.loads(Path('.ci/pcc-source.json').read_text())
          assert pin['repository'] == 'ikshengmin/pcc'
          assert re.fullmatch('[0-9a-f]{40}', pin['commit'])
          print('commit=' + pin['commit'])
          PY
      - name: Check out pinned PCC source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ikshengmin/pcc
          ref: ${{ steps.pcc.outputs.commit }}
          path: pcc
          persist-credentials: false
      - name: Use the declared CPython version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: gateway/.python-version
          allow-prereleases: true
      - name: Install frozen test dependencies only
        run: python -m pip install --disable-pip-version-check --require-hashes -r gateway/.ci/requirements.txt
      - name: Run bounded host and benchmark contracts
        run: python gateway/scripts/ci_gateway.py host --pcc-source pcc --output ci-results/host
      - name: Preserve exact identities, counts and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-host-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-results/host/
          if-no-files-found: warn
          retention-days: 14
